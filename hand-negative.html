<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>手指几何负片生成器 (自托管版)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d0d0d;color:#eee;padding:10px;font-size:14px}
h3{font-size:16px;margin-bottom:6px;background:linear-gradient(90deg,#0ff,#f0f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hint{opacity:.7;font-size:11px;line-height:1.5;margin:4px 0}
.panel{background:#161616;border:1px solid #222;border-radius:10px;padding:10px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;margin:5px 0;flex-wrap:wrap}
label{font-size:12px;color:#ccc;min-width:64px}
input[type=file]{color:#ccc;font-size:11px;flex:1}
input[type=range]{flex:1;accent-color:#0ff}
.val{font-size:11px;color:#0ff;min-width:36px;text-align:right}
select{flex:1;background:#222;color:#eee;border:1px solid #444;border-radius:6px;padding:5px;font-size:12px}
button{padding:8px 10px;font-size:12px;border-radius:8px;border:0;background:linear-gradient(135deg,#0ff,#08f);color:#000;font-weight:700;cursor:pointer;flex:1}
button:disabled{opacity:.4;cursor:not-allowed}
button.alt{background:linear-gradient(135deg,#f0f,#f80)}
button.warn{background:#333;color:#fff}
button.on{background:linear-gradient(135deg,#0f6,#6f0);color:#fff}
canvas{width:100%;max-height:48vh;background:#000;border-radius:8px;display:block;margin-top:4px;touch-action:none}
#status{font-size:11px;color:#ff0;min-height:14px;word-break:break-all;margin-top:4px}
#debug{font-size:10px;color:#888;max-height:60px;overflow:auto;margin-top:4px;white-space:pre-wrap}
</style>
</head>
<body>
<h3>✋ 手指几何负片生成器</h3>
<div class="hint">自托管版 · 所有资源从仓库本地加载 · 不依赖境外CDN</div>

<div class="panel">
  <div class="row"><input id="file" type="file" accept="video/*"></div>
  <div class="hint">建议 ≤720p / ≤30秒。</div>
</div>

<div class="panel">
  <div class="row">
    <label>自动形状</label>
    <select id="shapeSel">
      <option value="0">关(固定)</option>
      <option value="1" selected>三角→六边→十二边</option>
      <option value="2">圆→三角→六边→十二边</option>
      <option value="3">随机切换</option>
    </select>
  </div>
  <div class="row">
    <label>固定边数</label>
    <select id="fixedShape">
      <option value="3">3 三角</option>
      <option value="4">4 方形</option>
      <option value="6" selected>6 六边</option>
      <option value="8">8 八边</option>
      <option value="12">12 十二边</option>
      <option value="0">0 圆形</option>
    </select>
  </div>
  <div class="row">
    <label>Morph速度</label>
    <input type="range" id="morphSpeed" min="1" max="20" value="6">
    <span class="val" id="morphVal">6</span>
  </div>
  <div class="row">
    <label>大小</label>
    <input type="range" id="sizeRange" min="20" max="300" value="90">
    <span class="val" id="sizeVal">90</span>
  </div>
  <div class="row">
    <label>负片强度</label>
    <input type="range" id="mixRange" min="0" max="100" value="100">
    <span class="val" id="mixVal">100%</span>
  </div>
  <div class="row">
    <label>描边</label>
    <input type="range" id="edgeRange" min="0" max="100" value="70">
    <span class="val" id="edgeVal">70%</span>
  </div>
  <div class="row">
    <label>跟踪点</label>
    <select id="jointSel">
      <option value="8" selected>食指尖</option>
      <option value="12">中指尖</option>
      <option value="4">拇指尖</option>
      <option value="0">掌心</option>
    </select>
  </div>
</div>

<div class="panel">
  <div class="row">
    <label>LUT 风格</label>
    <select id="lutSel">
      <option value="0" selected>无(纯反相)</option>
      <option value="1">冷蓝调</option>
      <option value="2">暖橙调</option>
      <option value="3">赛博紫</option>
      <option value="4">复古绿</option>
      <option value="5">高对比B&W</option>
    </select>
  </div>
  <div class="row">
    <label>LUT强度</label>
    <input type="range" id="lutMix" min="0" max="100" value="50">
    <span class="val" id="lutVal">50%</span>
  </div>
  <div class="row">
    <label>色相偏移</label>
    <input type="range" id="hueRange" min="-180" max="180" value="0">
    <span class="val" id="hueVal">0°</span>
  </div>
  <div class="row">
    <label>饱和度</label>
    <input type="range" id="satRange" min="-100" max="100" value="20">
    <span class="val" id="satVal">+20</span>
  </div>
</div>

<div class="panel">
  <div class="row">
    <button id="run" disabled>开始处理</button>
    <button id="stop" class="warn" disabled>停止下载</button>
  </div>
  <div class="row">
    <button id="manualBtn" class="alt">手动纠偏:关</button>
    <span class="hint" style="margin:0;">开启后，手指在画面上拖动可覆盖自动位置</span>
  </div>
  <div id="status">正在从仓库本地加载模型…</div>
  <div id="debug"></div>
  <canvas id="out"></canvas>
</div>

<video id="src" playsinline style="display:none"></video>
<canvas id="off" style="display:none"></canvas>

<script type="module">
// ===== 所有资源从同仓库相对路径加载 =====
// 目录结构：
//   hand-negative.html
//   vision_bundle.mjs
//   hand_landmarker.task
//   wasm/
//     vision_wasm_internal.js
//     vision_wasm_internal.wasm
//     ...

import { HandLandmarker, FilesetResolver } from "./vision_bundle.mjs";

const $=id=>document.getElementById(id);
const statusEl=$('status'),runBtn=$('run'),stopBtn=$('stop');
const debugEl=$('debug');
const canvas=$('out'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const off=$('off'),octx=off.getContext('2d',{willReadFrequently:true});
const src=$('src');

function log(msg){console.log(msg);debugEl.textContent+='\n'+msg;}

// ===== 参数 =====
const cfg={
  shape:()=>+$('shapeSel').value,
  fixed:()=>+$('fixedShape').value,
  morphSpd:()=>+$('morphSpeed').value,
  size:()=>+$('sizeRange').value,
  mix:()=>+$('mixRange').value/100,
  edge:()=>+$('edgeRange').value/100,
  joint:()=>+$('jointSel').value,
  lut:()=>+$('lutSel').value,
  lutMix:()=>+$('lutMix').value/100,
  hue:()=>+$('hueRange').value,
  sat:()=>+$('satRange').value/100
};
$('sizeRange').oninput=e=>$('sizeVal').textContent=e.target.value;
$('mixRange').oninput=e=>$('mixVal').textContent=e.target.value+'%';
$('edgeRange').oninput=e=>$('edgeVal').textContent=e.target.value+'%';
$('morphSpeed').oninput=e=>$('morphVal').textContent=e.target.value;
$('lutMix').oninput=e=>$('lutVal').textContent=e.target.value+'%';
$('hueRange').oninput=e=>$('hueVal').textContent=e.target.value+'°';
$('satRange').oninput=e=>$('satVal').textContent=(e.target.value>=0?'+':'')+e.target.value;

// ===== 状态 =====
let landmarker=null,recorder=null,chunks=[],rafId=null,lastTs=-1;
let PW=0,PH=0,trail=[],lastValid={x:0,y:0,angle:0};
let audioCtx=null,mediaStream=null;
let manualMode=false,manualPos=null;
let frameCount=0;

// ===== 加载模型（自托管，带详细日志）=====
(async()=>{
  const TIMEOUT_MS = 120000;
  statusEl.textContent='正在从仓库加载 WASM…';
  runBtn.textContent='加载中…';
  runBtn.disabled=true;

  try {
    // Step 1: 加载 WASM
    log('Step 1: loading wasm from ./wasm');
    const vision = await FilesetResolver.forVisionTasks("./wasm");
    log('✓ WASM loaded');

    // Step 2: 加载模型
    statusEl.textContent='正在从仓库加载手部模型…';
    log('Step 2: loading model from ./hand_landmarker.task');
    landmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "./hand_landmarker.task",
        delegate: "CPU"
      },
      runningMode: "VIDEO",
      numHands: 1,
      minHandDetectionConfidence: 0.5,
      minHandPresenceConfidence: 0.5
    });
    log('✓ Model loaded');

    statusEl.textContent='✅ 模型就绪！请选择视频，然后点「开始处理」。';
    runBtn.textContent='选择视频后点此处理';
    runBtn.disabled=false;
  } catch(e) {
    statusEl.textContent='❌ 加载失败：' + e.message;
    runBtn.textContent='刷新重试';
    runBtn.disabled=false;
    runBtn.onclick=()=>location.reload();
    log('ERROR: ' + e.message);
    log('STACK: ' + e.stack);
    console.error(e);
  }
})();

// ===== 选文件 =====
$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  src.src=URL.createObjectURL(f);
  src.onloadedmetadata=()=>{
    const tgt=src.videoHeight>720?720:src.videoHeight;
    const sc=tgt/src.videoHeight;
    PW=Math.round(src.videoWidth*sc);PH=tgt;
    canvas.width=PW;canvas.height=PH;off.width=PW;off.height=PH;
    statusEl.textContent=`视频 ${src.videoWidth}x${src.videoHeight} → 处理 ${PW}x${PH}。可开始处理。`;
    runBtn.disabled=false;
  };
});

// ===== 形状Morph =====
const shapeSeqs={
  1:[3,6,12],
  2:[0,3,6,12],
  3:null
};
function getCurrentSides(){
  const mode=cfg.shape();
  if(mode===0) return cfg.fixed();
  const spd=cfg.morphSpd();
  const period=Math.max(2,Math.round(30/spd));
  if(mode===3){
    if(frameCount%period===0) return [3,4,6,8,12,0][Math.floor(Math.random()*6)];
    return lastSides||6;
  }
  const seq=shapeSeqs[mode];
  const idx=Math.floor(frameCount/period)%seq.length;
  return seq[idx];
}
let lastSides=6;

function polygonMask(lx,ly,R,sides){
  if(sides<=0)return Math.hypot(lx,ly)-R;
  const tau=Math.PI*2,seg=tau/sides;
  let a=Math.atan2(ly,lx);if(a<0)a+=tau;
  const i=Math.floor(a/seg),a0=i*seg,a1=(i+1)*seg;
  const vx1=Math.cos(a1)*R,vy1=Math.sin(a1)*R;
  const den=vx1*vx1+vy1*vy1;
  const tt=den>0?Math.max(0,Math.min(1,(lx*vx1+ly*vy1)/den)):0;
  const px=Math.cos(a0)*R+(Math.cos(a1)*R-Math.cos(a0)*R)*tt;
  const py=Math.sin(a0)*R+(Math.sin(a1)*R-Math.sin(a0)*R)*tt;
  const d=Math.hypot(lx-px,ly-py);
  const rIn=R*Math.cos(Math.PI/sides);
  return Math.hypot(lx,ly)<rIn?-d:d;
}
function polygonMaskMorph(lx,ly,R,sidesA,sidesB,t){
  return polygonMask(lx,ly,R,sidesA)*(1-t)+polygonMask(lx,ly,R,sidesB)*t;
}

// ===== LUT =====
function applyLUT(r,g,b,lutId,mix){
  if(lutId===0) return [r,g,b];
  let nr=r,gv=g,nb=b;
  switch(lutId){
    case 1: nr*=0.7;gv*=0.85;nb=nb*0.6+100*mix; break;
    case 2: nr=nr*0.6+120*mix;gv=gv*0.7+60*mix;nb*=0.6; break;
    case 3: nr=nr*0.7+80*mix;gv*=0.5;nb=nb*0.5+140*mix; break;
    case 4: nr=nr*0.5+40*mix;gv=gv*0.5+90*mix;nb*=0.5; break;
    case 5: {const y=0.299*r+0.587*g+0.114*b;const c=y>128?y*1.3:Math.max(0,y*0.7);nr=c;gv=c;nb=c;} break;
  }
  return [r*(1-mix)+nr*mix,g*(1-mix)+gv*mix,b*(1-mix)+nb*mix];
}
function rgb2hsl(r,g,b){
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
  let h=0,s=0;
  if(mx!==mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    switch(mx){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;}
    h*=60;
  }
  return [h,s,l];
}
function hsl2rgb(h,s,l){
  h=(h%360+360)%360;
  const c=(1-Math.abs(2*l-1))*s;
  const x=c*(1-Math.abs((h/60)%2-1));
  const m=l-c/2;let r=0,g=0,b=0;
  if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}
  return [(r+m)*255,(g+m)*255,(b+m)*255];
}

// ===== 手动纠偏 =====
$('manualBtn').addEventListener('click',()=>{
  manualMode=!manualMode;
  $('manualBtn').textContent='手动纠偏:'+(manualMode?'开':'关');
  $('manualBtn').className=manualMode?'on':'alt';
  statusEl.textContent=manualMode?'手动模式：手指在画面上拖动锚点':'自动模式';
});
canvas.addEventListener('touchstart',e=>{if(!manualMode)return;e.preventDefault();
  const t=e.touches[0],r=canvas.getBoundingClientRect();
  manualPos={x:(t.clientX-r.left)*(PW/r.width),y:(t.clientY-r.top)*(PH/r.height)};
});
canvas.addEventListener('touchmove',e=>{if(!manualMode)return;e.preventDefault();
  const t=e.touches[0],r=canvas.getBoundingClientRect();
  manualPos={x:(t.clientX-r.left)*(PW/r.width),y:(t.clientY-r.top)*(PH/r.height)};
});

// ===== 渲染一帧 =====
function renderFrame(tip){
  octx.drawImage(src,0,0,PW,PH);
  const lutId=cfg.lut(),lutMix=cfg.lutMix();
  const hueShift=cfg.hue(),satAdj=cfg.sat();
  if(!tip){ctx.drawImage(off,0,0);return;}
  const imgData=octx.getImageData(0,0,PW,PH);
  const data=imgData.data;
  const sides=cfg.shape()===0?cfg.fixed():getCurrentSides();
  lastSides=sides;
  const R=cfg.size()*PW/480,mix=cfg.mix(),edgeMix=cfg.edge();
  const cosA=Math.cos(-tip.angle),sinA=Math.sin(-tip.angle);
  const edgeW=2.5;
  let morphSidesA=sides,morphSidesB=sides,morphT=0;
  if(cfg.shape()===1||cfg.shape()===2){
    const spd=cfg.morphSpd();
    const period=Math.max(2,Math.round(30/spd));
    const phase=frameCount%period;
    morphT=phase/period;
    const seq=shapeSeqs[cfg.shape()];
    const idx=Math.floor(frameCount/period)%seq.length;
    morphSidesA=seq[idx];morphSidesB=seq[(idx+1)%seq.length];
  }
  for(let py=0;py<PH;py++){
    const rowOff=py*PW;
    for(let px=0;px<PW;px++){
      const dx=px-tip.x,dy=py-tip.y;
      const lx=dx*cosA-dy*sinA,ly=dx*sinA+dy*cosA;
      let d=(morphSidesA===morphSidesB)?polygonMask(lx,ly,R,morphSidesA):polygonMaskMorph(lx,ly,R,morphSidesA,morphSidesB,morphT);
      const idx=(rowOff+px)<<2;
      const r=data[idx],g=data[idx+1],b=data[idx+2];
      if(d<0){
        let nr=255-r,ng=255-g,nb=255-b;
        if(lutId)[nr,ng,nb]=applyLUT(nr,ng,nb,lutId,lutMix);
        if(hueShift||satAdj){let [h,s,l]=rgb2hsl(nr,ng,nb);h=(h+hueShift+360)%360;s=Math.max(0,Math.min(1,s+satAdj));[nr,ng,nb]=hsl2rgb(h,s,l);}
        data[idx]=nr*mix+r*(1-mix);data[idx+1]=ng*mix+g*(1-mix);data[idx+2]=nb*mix+b*(1-mix);
      }else if(d<edgeW){
        const ew=edgeMix*(1-d/edgeW);
        data[idx]=r*(1-ew)+255*ew;data[idx+1]=g*(1-ew)+255*ew;data[idx+2]=b*(1-ew)+255*ew;
      }else if(hueShift||satAdj){
        let [h,s,l]=rgb2hsl(r,g,b);h=(h+hueShift+360)%360;s=Math.max(0,Math.min(1,s+satAdj));const [nr,ng,nb]=hsl2rgb(h,s,l);
        data[idx]=nr;data[idx+1]=ng;data[idx+2]=nb;
      }
    }
  }
  octx.putImageData(imgData,0,0);
  ctx.drawImage(off,0,0);
}

// ===== 主循环 =====
function loop(){
  if(src.paused||src.ended)return;
  if(src.currentTime!==lastTs){
    lastTs=src.currentTime;frameCount++;
    let results=null;
    try{results=landmarker.detectForVideo(src,performance.now());}catch(_){}
    let tip=null;
    if(manualPos){tip={x:manualPos.x,y:manualPos.y,angle:lastValid.angle||0};
    }else if(results&&results.landmarks&&results.landmarks.length){
      const lm=results.landmarks[0],j=cfg.joint();
      const tx=lm[j].x*PW,ty=lm[j].y*PH;
      const dx=lm[j].x-lm[0].x,dy=lm[j].y-lm[0].y;
      tip={x:tx,y:ty,angle:Math.atan2(dy,dx)};
      lastValid={...tip};
    }else{tip=trail.length?trail[trail.length-1]:null;}
    if(tip){trail.push({...tip});if(trail.length>90)trail.shift();}
    renderFrame(tip);
  }
  rafId=requestAnimationFrame(loop);
}

// ===== 开始/停止 =====
runBtn.addEventListener('click',async()=>{
  if(!src.src){statusEl.textContent='先选视频';return;}
  if(!landmarker){statusEl.textContent='模型未就绪';return;}
  runBtn.disabled=true;stopBtn.disabled=false;chunks=[];trail=[];frameCount=0;lastTs=-1;manualPos=null;
  src.muted=false;src.currentTime=0;
  try{await src.play();}catch(e){statusEl.textContent='播放失败:'+e.message;return;}
  mediaStream=canvas.captureStream(30);
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const aSrc=audioCtx.createMediaElementSource(src);
    const dest=audioCtx.createMediaStreamDestination();
    aSrc.connect(dest);aSrc.connect(audioCtx.destination);
    dest.getAudioTracks().forEach(t=>mediaStream.addTrack(t));
  }catch(e){console.warn('audio',e);}
  let mime='';
  if(MediaRecorder.isTypeSupported('video/mp4;codecs=h264,aac'))mime='video/mp4;codecs=h264,aac';
  else if(MediaRecorder.isTypeSupported('video/mp4'))mime='video/mp4';
  else if(MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus'))mime='video/webm;codecs=vp9,opus';
  else if(MediaRecorder.isTypeSupported('video/webm'))mime='video/webm';
  recorder=mime?new MediaRecorder(mediaStream,{mimeType:mime}):new MediaRecorder(mediaStream);
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{
    const ext=mime.includes('mp4')?'mp4':'webm';
    const blob=new Blob(chunks,{type:mime||'video/mp4'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='hand-negative.'+ext;a.click();
    statusEl.textContent='✅ 完成!下载 hand-negative.'+ext;
    runBtn.disabled=false;stopBtn.disabled=true;
  };
  recorder.start(100);
  statusEl.textContent='处理中…';
  rafId=requestAnimationFrame(loop);
  src.onended=()=>stopAll();
});
stopBtn.addEventListener('click',()=>stopAll());
function stopAll(){src.pause();if(recorder&&recorder.state!=='inactive')recorder.stop();cancelAnimationFrame(rafId);}
</script>
</body>
</html>
